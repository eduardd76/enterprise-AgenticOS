frr defaults traditional
hostname lab-r1
!
router bgp 65001
 bgp router-id 10.10.0.2
 no bgp ebgp-requires-policy
 neighbor 10.10.0.3 remote-as 65002
 neighbor 10.10.0.3 timers 3 9
 neighbor 10.10.0.3 timers connect 2
 address-family ipv4 unicast
  network 192.0.2.0/24
 exit-address-family
!
ip route 192.0.2.0/24 blackhole
!
