frr defaults traditional
hostname lab-r2
!
router bgp 65002
 bgp router-id 10.10.0.3
 no bgp ebgp-requires-policy
 neighbor 10.10.0.2 remote-as 65001
 neighbor 10.10.0.2 timers 3 9
 neighbor 10.10.0.2 timers connect 2
 address-family ipv4 unicast
  network 198.51.100.0/24
 exit-address-family
!
ip route 198.51.100.0/24 blackhole
!
