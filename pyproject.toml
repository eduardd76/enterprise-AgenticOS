[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agenticos"
version = "0.1.0"
description = "AI change control for network operations: a deterministic kernel that governs AI agents (AOS-0001 implementation)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
batfish = ["pybatfish>=2025.7"]

[project.scripts]
agenticos = "agenticos.cli:main"

[project.urls]
Repository = "https://github.com/eduardd76/enterprise-AgenticOS"

[tool.setuptools.packages.find]
include = ["agenticos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
