name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      AOS_REQUIRE_SANDBOX: "1"     # CI proves the sandboxed path, never the fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python -m pip install -e '.[dev]'
      - run: python -c "from agenticos.kernel import detect_isolation as d; i=d(); print(i); assert i != 'process'"
      - run: python -m pytest -q
      - run: python -m agenticos demo --db var/ci.db
      - run: python -m agenticos lifecycle --db var/ci-lc.db

  # Real routers: two FRR containers with a live eBGP session. AgenticOS fixes a real
  # interface-shutdown outage through the kernel. The scripted reasoner keeps this
  # deterministic; local-LLM runs are a manual/local concern (models are multi-GB).
  lab:
    runs-on: ubuntu-24.04
    env:
      AOS_REQUIRE_SANDBOX: "1"
      AOS_LAB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python -m pip install -e '.[dev]'
      - name: Start FRR lab
        run: labs/frr-bgp/lab.sh up
      - name: Live-lab tests
        run: python -m pytest -q tests/test_frr_driver.py -rs
      - name: Reset lab and run the real-router demo
        run: |
          labs/frr-bgp/lab.sh up
          python -m agenticos demo --lab --db var/lab.db
      - name: Independent check (plain vtysh, not AgenticOS)
        run: |
          for i in $(seq 1 20); do
            docker exec aos-lab-r2 vtysh -c "show ip bgp" | grep -q "192.0.2.0/24" && \
              docker exec aos-lab-r1 vtysh -c "show ip bgp" | grep -q "198.51.100.0/24" && break
            [ "$i" = 20 ] && { docker exec aos-lab-r2 vtysh -c "show ip bgp"; exit 1; }
            sleep 1
          done
          docker exec aos-lab-r2 vtysh -c "show ip bgp"
      - name: Diagnostics on failure
        if: failure()
        run: |
          labs/frr-bgp/lab.sh status || true
          docker logs aos-lab-r1 2>&1 | tail -50 || true
          ls var/logs 2>/dev/null && tail -n 30 var/logs/*.log || true
      - name: Tear down
        if: always()
        run: labs/frr-bgp/lab.sh down

  # The pilot integrations, live: NetBox as the source of truth (seeded from the EVPN lab
  # files) and Batfish predicting the two-fault fabric from the lab's configs. No cEOS needed:
  # both work from the configs and the inventory.
  integrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,batfish]'
      - name: Start Batfish
        run: |
          docker run -d --name batfish -p 127.0.0.1:9996:9996 batfish/allinone
          for i in $(seq 1 60); do nc -z 127.0.0.1 9996 && break; sleep 2; done
      - name: Start and seed NetBox
        run: labs/evpn-ceos/netbox/netbox.sh up
      - name: Live NetBox + Batfish tests
        run: |
          set -a; . var/netbox.env; set +a
          AOS_NETBOX=1 AOS_BATFISH=1 python -m pytest -q -rs \
            tests/test_netbox_sot.py tests/test_batfish_twin.py
