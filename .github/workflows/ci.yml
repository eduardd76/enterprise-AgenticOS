name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      AOS_REQUIRE_SANDBOX: "1"     # CI proves the sandboxed path, never the fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python -m pip install -e '.[dev]'
      - run: python -c "from agenticos.kernel import detect_isolation as d; i=d(); print(i); assert i != 'process'"
      - run: python -m pytest -q
      - run: python -m agenticos demo --db var/ci.db
      - run: python -m agenticos lifecycle --db var/ci-lc.db
